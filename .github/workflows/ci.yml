name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -s -d .)"

      - name: go mod tidy
        run: go mod tidy && git diff --no-patch --exit-code

      - name: go vet
        run: go vet ./...

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate icon
        run: .\scripts\make-icon.ps1
        shell: pwsh

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: go generate
        run: go generate

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -ldflags "-H=windowsgui -s -w" -o snapflow.exe .
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapflow-dev
          path: snapflow.exe
          retention-days: 7
