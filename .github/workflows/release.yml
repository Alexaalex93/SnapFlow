name: Release

# Every push to main builds and publishes a versioned release.
# Version is read from the VERSION file in the repo root.
# To ship a new version: update VERSION, commit, push.
#
# Tags (v*) also trigger a release using the tag version — useful if you
# want to release a hotfix at a specific commit without touching VERSION.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      # ── Version ───────────────────────────────────────────────────────────
      # VERSION file holds MAJOR.MINOR (e.g. "1.0").
      # Patch = total commit count on this branch — auto-increments every push.
      # To release 1.1: change VERSION to "1.1" and push.
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $raw   = (Get-Content VERSION -Raw).Trim()
            # Keep only MAJOR.MINOR — split on "." and take first two parts.
            $parts = $raw -split '\.'
            $base  = "$($parts[0]).$($parts[1] ?? '0')"
            $patch = git rev-list --count HEAD
            $v = "$base.$patch"
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      # ── Icon ─────────────────────────────────────────────────────────────
      - name: Regenerate icon
        shell: powershell
        run: .\scripts\make-icon.ps1

      # ── Embed version + icon ──────────────────────────────────────────────
      - name: Install goversioninfo
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Patch versioninfo.json
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.VERSION }}'
          $vi  = Get-Content versioninfo.json -Raw | ConvertFrom-Json
          $num = ($ver -replace '[^0-9.]', '') -split '\.'
          $vi.FixedFileInfo.FileVersion.Major    = [int]($num[0] -replace '[^0-9]','0')
          $vi.FixedFileInfo.FileVersion.Minor    = [int]($num[1] -replace '[^0-9]','0')
          $vi.FixedFileInfo.FileVersion.Patch    = [int]($num[2] -replace '[^0-9]','0')
          $vi.FixedFileInfo.ProductVersion.Major = [int]($num[0] -replace '[^0-9]','0')
          $vi.FixedFileInfo.ProductVersion.Minor = [int]($num[1] -replace '[^0-9]','0')
          $vi.FixedFileInfo.ProductVersion.Patch = [int]($num[2] -replace '[^0-9]','0')
          $vi.StringFileInfo.FileVersion    = $ver
          $vi.StringFileInfo.ProductVersion = $ver
          $vi | ConvertTo-Json -Depth 10 | Set-Content versioninfo.json -Encoding utf8

      - name: go generate (resource.syso)
        shell: pwsh
        run: go generate

      # ── Build exe ─────────────────────────────────────────────────────────
      - name: Build exe
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.VERSION }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H=windowsgui -s -w -X main.appVersion=$ver" -o dist\snapflow.exe .
          Write-Host "snapflow.exe — $([int]((Get-Item dist\snapflow.exe).Length/1KB)) KB"

      # ── Installer ─────────────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver  = '${{ steps.ver.outputs.VERSION }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found" }
          & $iscc "scripts\installer.iss" "/DAppVersion=$ver"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          # Name the installer with the version number
          Rename-Item dist\SnapFlow-Setup.exe "SnapFlow-$ver-Setup.exe"
          Get-ChildItem dist\ | Format-Table Name, @{N='Size(KB)';E={[int]($_.Length/1KB)}}

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.ver.outputs.VERSION }}'
          $tag = '${{ steps.ver.outputs.TAG }}'

          # If a release for this version already exists, delete it first
          # so we get a clean replace (same version, new build).
          gh release delete $tag --yes --cleanup-tag 2>$null; $true

          gh release create $tag `
            --title "SnapFlow v$ver" `
            --notes @"
          ## Install

          Download and run **SnapFlow-$ver-Setup.exe**.

          - Installs to ``%LOCALAPPDATA%\SnapFlow`` (no admin required)
          - Optional desktop shortcut
          - Optional autostart at login
          - Uninstaller in Add/Remove Programs

          **Requires [WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/)**
          (pre-installed on Windows 11; available via Windows Update on Windows 10).
          "@ `
            "dist\SnapFlow-$ver-Setup.exe" `
            "dist\snapflow.exe"
